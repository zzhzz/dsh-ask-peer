# dsh-ask-peer bundle layer. The row is inserted over the base profile; later
# layers (profile cordis.patch.yml, home patch, --patch overlays) win per row
# and replace the whole `config` value, so restate every key you need.
- insert:
    - id: ask-peer
      name: dsh-ask-peer
      config:
        callerName: 'local'
        description: ''
        tags: []
        rosterRefreshMs: 60000
        listen: false
        listenHost: '127.0.0.1'
        listenPort: 3877
        requireToken: true
        workspace: '.'
        timeoutMs: 120000
        maxAnswerChars: 48000
        approvalTimeoutMs: 120000
        allowExecution: false
        peers: []
